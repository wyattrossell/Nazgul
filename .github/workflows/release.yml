name: release

# Push a tag like v0.2.0 (or run manually) to build the Windows installer, publish a
# GitHub Release, and upload latest.json for the in-app updater.
#
# The build is Authenticode-signed when a code-signing certificate is provided as repo
# secrets; without them it still builds, just unsigned.
#   WINDOWS_CERT_PFX_BASE64  - base64 of your code-signing .pfx
#   WINDOWS_CERT_PASSWORD    - the .pfx password
# These are Authenticode signing (Defender / SentinelOne trust) and are separate from
# TAURI_SIGNING_PRIVATE_KEY, which only signs the auto-update manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Stage code-signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          # The sign hook (scripts/sign-hook.cmd) is invoked by bare name from NSIS,
          # so it must be on PATH for the build step.
          "$env:GITHUB_WORKSPACE\scripts" >> $env:GITHUB_PATH
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "No signing certificate secret set; the release will be unsigned."
            "configured=false" >> $env:GITHUB_OUTPUT
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP "nazgul-codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            "pfx=$pfx" >> $env:GITHUB_OUTPUT
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NAZGUL_PFX: ${{ steps.cert.outputs.pfx }}
          NAZGUL_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Nazgul v__VERSION__"
          releaseBody: "Windows installer. The app updates itself from this release on next launch. See docs/DEPLOYMENT.md for allowlisting on managed endpoints."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      - name: Remove staged certificate
        if: always() && steps.cert.outputs.configured == 'true'
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "${{ steps.cert.outputs.pfx }}"

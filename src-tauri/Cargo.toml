[package]
name = "nazgul"
version = "0.2.0"
description = "Nazgul - retro-terminal desktop OSINT workbench"
authors = ["Wyatt"]
edition = "2021"

[lib]
name = "nazgul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "socks", "gzip", "brotli", "deflate"] }
once_cell = "1"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
hickory-resolver = "0.24"
md-5 = "0.10"
phonenumber = "0.3"
regex = "1"
murmur3 = "0.5"
base64 = "0.22"
kamadak-exif = "0.6"
imagesize = "0.15"
sha2 = "0.10"
sha3 = "0.10"
keyring = { version = "3", features = ["windows-native"] }
lopdf = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
